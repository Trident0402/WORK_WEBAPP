<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Diary WebApp</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Diary WebApp">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="header-content">
      <div class="user-profile">
        <div class="avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span class="greeting">早安，<br/>今天有什麼計畫？</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
        </button>
        <button class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="app-content">
    
    <!-- Dashboard (Today) Section -->
    <section id="section-dashboard" class="page-view active">
      <div class="calendar-widget">
        <!-- Calendar content injected by dashboard.js -->
        <div id="dashboard-calendar"></div>
      </div>
      
      <div class="sub-tabs-container">
        <button class="sub-tab-btn active">今天</button>
        <button class="sub-tab-btn" onclick="app.navigate('tomorrow')">明日規劃</button>
      </div>

      <div id="dashboard-feed" class="feed-container">
        <!-- Memos injected by dashboard.js -->
      </div>
    </section>

    <!-- Tomorrow Plan Section -->
    <section id="section-tomorrow" class="page-view">
      <div class="calendar-widget">
        <div id="tomorrow-calendar"></div>
      </div>
      
      <div class="sub-tabs-container">
        <button class="sub-tab-btn" onclick="app.navigate('dashboard')">今天</button>
        <button class="sub-tab-btn active">明日規劃</button>
      </div>

      <!-- Reschedule Banner injected by tomorrow.js if needed -->
      <div id="tomorrow-banner-container"></div>

      <div id="tomorrow-feed" class="feed-container">
        <!-- Memos injected by tomorrow.js -->
      </div>
    </section>

    <!-- Todo Hub Section -->
    <section id="section-todohub" class="page-view">
      <div class="filters-container">
        <div class="search-bar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input type="text" id="todo-search-input" placeholder="搜尋代辦事項..." />
        </div>
        <div class="filter-chips">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="pending">進行中</button>
          <button class="chip" data-filter="completed">已完成</button>
        </div>
      </div>

      <div id="todohub-feed" class="todos-list-container">
        <!-- Todos injected by todohub.js -->
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-content">
      <button class="nav-item active" onclick="app.navigate('dashboard')" data-target="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>首頁</span>
      </button>

      <button class="nav-item add-btn" onclick="capture.openModal()">
        <div class="add-btn-inner">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
      </button>

      <button class="nav-item" onclick="app.navigate('todohub')" data-target="todohub">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span>代辦中心</span>
      </button>
    </div>
  </nav>

  <!-- Quick Capture / Edit Modal -->
  <div id="capture-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <button class="icon-btn" onclick="capture.closeModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div class="modal-actions">
          <button class="save-btn" onclick="capture.save()">儲存</button>
        </div>
      </div>
      
      <div class="modal-body">
        <div class="date-selector">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <input type="date" id="capture-date-input" />
        </div>
        
        <textarea id="capture-textarea" placeholder="記下你想說的話，或是輸入 '- [ ] ' 來建立代辦事項..."></textarea>
        
        <!-- Only show checkbox in 'add' mode -->
        <div id="capture-options" class="capture-options">
          <label>
            <input type="checkbox" id="capture-new-card-checkbox">
            建立為獨立新卡片
          </label>
        </div>
      </div>

      <!-- Only show in 'edit' mode -->
      <div id="capture-delete-container" class="modal-footer" style="display: none;">
        <button class="delete-btn" onclick="capture.deleteMemo()">刪除此紀錄</button>
      </div>

      <div class="editor-toolbar">
        <button class="toolbar-btn" onclick="capture.insertTodoTemplate()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        </button>
        <button class="toolbar-btn" onclick="capture.insertImage()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Reschedule Modal -->
  <div id="reschedule-modal" class="modal-overlay">
    <div class="modal-content small-modal">
      <div class="modal-header">
        <h3>搬移未完成事項</h3>
        <button class="icon-btn" onclick="tomorrow.closeRescheduleModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body reschedule-body">
        <p>將選定日期的未完成事項移轉至：</p>
        <input type="date" id="reschedule-date-input" class="full-width-date" />
        <button class="save-btn full-width-btn" style="margin-top:20px;" onclick="tomorrow.confirmReschedule()">確認移轉</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/tomorrow.js"></script>
  <script src="js/todohub.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
